<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💥Dashboard Gamming</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">
        <header class="header">
            <h1>💥Dashboard Gamming</h1>
        </header>

        <aside class="aside">
            <div class="user-container">
                <section class="module user-module">
                    <h2>Perfil del jugador</h2>
                </section>
                <section class="module big-module">
                    <h3>Menú principal</h3>
                </section>
            </div>
        </aside>

        <main class="main">
            <div class="module">

                <article class="module" >
                    <h3>🎯Juegos Recientes</h3>
                </article>

                <article class="module" >
                    <h3>🎮 Partidas de hoy</h3>
                </article>

                <article class="module" >
                    <h3>🕓 Tiempo Jugado</h3>
                </article>

                <article class="module" >
                    <h3>🦴Total Kills</h3>
                </article>

                <article class="module horizontal-module" >
                    <h3>🏆Mis Logros</h3>
                </article>

                <article class="module" >
                    <h3>👭Amigos</h3>
                </article>

                <article class="module vertical-module" >
                    <h3>🏅Top Jugadores</h3>
                </article>

                <article class="module" >
                    <h3>💰G-Coins</h3>
                </article>

                <article class="module" >
                    <h3>💎Skill Rating</h3>
                </article>


            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Dashboard Gaming 🎮</p>
        </footer>


    </div>

</body>

</html>
